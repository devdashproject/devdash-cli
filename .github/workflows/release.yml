name: Release

on:
  push:
    tags:
      - "v*"
  # Publish an EXISTING release to npm on demand (backfills, or retry after a
  # credential problem). Does not rebuild or re-release anything on GitHub.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    # Publishes to npm every time a release is cut (tag push), or on demand for
    # an existing tag (workflow_dispatch). Binaries come from the GitHub release
    # itself, so a retry never depends on build artifacts that have expired.
    # Gated by repo var PUBLISH_NPM so GitHub releases still work if the npm
    # credential is ever broken; set it to 'true' once NPM_TOKEN is valid.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') && vars.PUBLISH_NPM == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Resolve version and npm dist-tag
        id: version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "TAG=next" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Require npm credentials
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty. Publishing is enabled (PUBLISH_NPM=true) but there is no credential."
            exit 1
          fi
          npm whoami

      - name: Download release binaries
        run: |
          mkdir -p assets dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern '*.tar.gz' --pattern '*.zip'
          # Lay out as dist/devdash_<os>_<arch>/<binary>, which build-packages.js expects.
          for f in assets/*; do
            name=$(basename "$f"); name="${name%.tar.gz}"; name="${name%.zip}"
            # devdash_<version>_<os>_<arch>
            os=$(echo "$name" | cut -d_ -f3); arch=$(echo "$name" | cut -d_ -f4)
            out="dist/devdash_${os}_${arch}"
            mkdir -p "$out"
            case "$f" in
              *.tar.gz) tar -xzf "$f" -C "$out" ;;
              *.zip)    unzip -q -o "$f" -d "$out" ;;
            esac
          done
          ls dist

      - name: Build npm packages
        run: |
          cd npm
          node build-packages.js "${{ steps.version.outputs.VERSION }}"

      - name: Publish platform packages, then wrapper
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NPM_TAG="${{ steps.version.outputs.TAG }}"
          publish() {
            dir="$1"
            name=$(node -p "require('./$dir/package.json').name")
            # Idempotent: a retry after a partial publish skips what is already there.
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already published; skipping"
              return 0
            fi
            (cd "$dir" && npm publish --access public --tag "$NPM_TAG")
          }
          # Platform packages first so the wrapper's optionalDependencies resolve.
          for dir in npm/devdash-darwin-arm64 npm/devdash-darwin-x64 npm/devdash-linux-x64 npm/devdash-linux-arm64 npm/devdash-win32-x64 npm/devdash-win32-arm64; do
            if [ -d "$dir" ]; then publish "$dir"; else echo "::error::$dir does not exist"; exit 1; fi
          done
          publish npm/devdash-cli

      - name: Verify on npm
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NPM_TAG="${{ steps.version.outputs.TAG }}"
          for i in 1 2 3 4 5 6; do
            got=$(npm view "@devdashproject/devdash-cli@$VERSION" version 2>/dev/null || true)
            [ "$got" = "$VERSION" ] && break
            sleep 10
          done
          [ "$got" = "$VERSION" ] || { echo "::error::npm does not show @devdashproject/devdash-cli@$VERSION"; exit 1; }
          echo "Published @devdashproject/devdash-cli@$VERSION (dist-tag: $NPM_TAG)"
